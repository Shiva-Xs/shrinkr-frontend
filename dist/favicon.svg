<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#0d0d0d"/>
  <defs>
    <!-- Mask to hide the right loop where the left loop crosses OVER it (top-center) -->
    <mask id="mr">
      <rect width="32" height="32" fill="white"/>
      <line x1="13" y1="11.5" x2="19" y2="15" stroke="black" stroke-width="3.5" stroke-linecap="round"/>
    </mask>
    <!-- Mask to hide the left loop where the right loop crosses OVER it (bottom-center) -->
    <mask id="ml">
      <rect width="32" height="32" fill="white"/>
      <line x1="13" y1="17" x2="19" y2="20.5" stroke="black" stroke-width="3.5" stroke-linecap="round"/>
    </mask>
  </defs>
  <!-- Right loop (behind at top crossing, in front at bottom crossing) -->
  <path d="M 16 14.2 C 18.5 10, 27 10, 27 16 C 27 22, 18.5 22, 16 17.8"
        fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        mask="url(#mr)"/>
  <!-- Left loop (behind at bottom crossing, in front at top crossing) -->
  <path d="M 16 17.8 C 13.5 22, 5 22, 5 16 C 5 10, 13.5 10, 16 14.2"
        fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        mask="url(#ml)"/>
</svg>
